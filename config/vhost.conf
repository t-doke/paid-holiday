<VirtualHost *:80>
    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        AllowOverride All
        Require all granted
        Options +FollowSymLinks
        AddType application/x-httpd-php .php
    </Directory>

    # PHPファイルを処理するための設定
    SetHandler application/x-httpd-php
</VirtualHost>
